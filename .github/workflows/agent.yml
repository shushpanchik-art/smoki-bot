name: ai-agent

on:
  issues:
    types: [labeled]

jobs:
  run:
    if: github.event.label.name == 'ai-task' && github.event.sender.login == 'shushpanchik-art'
    runs-on: [self-hosted, smoki-agent]
    timeout-minutes: 45
    env:
      ISSUE_NUM: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      TASK_TEXT: ${{ github.event.issue.body }}
      RUN_BRANCH: agent/issue-${{ github.event.issue.number }}-${{ github.run_id }}
      GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          # aider в отдельном окружении, чтобы его зависимости не конфликтовали с проектом
          python3 -m venv "$RUNNER_TEMP/aider-venv"
          "$RUNNER_TEMP/aider-venv/bin/pip" install -q --upgrade pip
          "$RUNNER_TEMP/aider-venv/bin/pip" install -q aider-chat

          # зависимости проекта ставятся как есть из репозитория
          python3 -m venv "$RUNNER_TEMP/proj-venv"
          "$RUNNER_TEMP/proj-venv/bin/pip" install -q --upgrade pip
          "$RUNNER_TEMP/proj-venv/bin/pip" install -q -r requirements.txt -r requirements-dev.txt
          echo "$RUNNER_TEMP/proj-venv/bin" >> "$GITHUB_PATH"

      - name: Server snapshot (read-only)
        run: |
          git config --global --add safe.directory /opt/SMOKI/bot
          {
            echo "## Git /opt/SMOKI/bot"
            git -C /opt/SMOKI/bot log -3 --oneline || true
            git -C /opt/SMOKI/bot status --short || true
            echo "## Сервисы smoki-*"
            systemctl list-units 'smoki-*' --no-pager --plain || true
          } > "$RUNNER_TEMP/server.txt" 2>&1

      - name: Prepare task
        run: |
          git config user.name "ai-agent"
          git config user.email "ai-agent@users.noreply.github.com"
          git checkout -b "$RUN_BRANCH"
          {
            printf '%s\n\n%s\n\n' "$ISSUE_TITLE" "$TASK_TEXT"
            printf '%s\n' \
              '---' \
              'Правила проекта (docs/SPEC.md, обязательны):' \
              '- Не меняй .github/, requirements*.txt и docs/SPEC.md.' \
              '- Не читай и не выводи .env, *.db, *.session и любые секреты.' \
              '- Не меняй схему БД, если задача прямо этого не требует.' \
              '- Проверки оформляй pytest-тестами в tests/.' \
              '- Перед завершением ruff и mypy должны проходить на изменённых файлах.' \
              '- Если задача — вопрос, ничего не меняй, ответь текстом.' \
              '- Если что-то непонятно — спроси, не действуй наугад.' \
              '- В конце дай отчёт: что сделано, что проверено, что неясно.' \
              '' \
              'Снимок состояния сервера (только чтение):'
            cat "$RUNNER_TEMP/server.txt"
          } > "$RUNNER_TEMP/task.txt"

      - name: Run agent (Gemini)
        id: agent
        continue-on-error: true
        run: |
          set -o pipefail
          "$RUNNER_TEMP/aider-venv/bin/aider" \
            --model gemini/gemini-3.1-pro-preview \
            --yes-always \
            --no-gitignore \
            --no-pretty \
            --no-suggest-shell-commands \
            --no-check-update \
            --chat-history-file "$RUNNER_TEMP/aider.chat.md" \
            --input-history-file "$RUNNER_TEMP/aider.input" \
            --read docs/SPEC.md \
            --message-file "$RUNNER_TEMP/task.txt" 2>&1 | tee "$RUNNER_TEMP/aider.out"

      - name: Guard protected paths
        id: guard
        continue-on-error: true
        run: |
          git fetch origin main
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::Есть незакоммиченные изменения"; git status --short; exit 1
          fi
          changed="$(git diff --name-only origin/main HEAD)"
          if echo "$changed" | grep -E '^(\.github/|requirements[^/]*\.txt$|docs/SPEC\.md$|db/schema\.sql$)'; then
            echo "::error::Защищённые файлы изменены"; echo "$changed"; exit 1
          fi
          if git diff --quiet origin/main HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Local checks
        id: checks
        if: steps.guard.outcome == 'success' && steps.guard.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          python -m ruff check . --exclude venv,data,__pycache__
          changed_py="$(git diff --name-only origin/main HEAD -- '*.py')"
          [ -z "$changed_py" ] || python -m mypy $changed_py
          python -m pytest -q

      - name: Push and open PR
        id: pr
        if: steps.guard.outcome == 'success' && steps.guard.outputs.has_changes == 'true' && steps.checks.outcome == 'success'
        continue-on-error: true
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUN_BRANCH"
          url="$(gh pr create --base main --head "$RUN_BRANCH" --title "AI: $ISSUE_TITLE" --body "Refs #$ISSUE_NUM. Проверьте diff перед merge.")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report to issue
        if: always()
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          PR_URL: ${{ steps.pr.outputs.url }}
          HAS_CHANGES: ${{ steps.guard.outputs.has_changes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$RUNNER_TEMP/report.md"
          {
            echo "## Отчёт агента"
            echo
            echo "Лог: $RUN_URL"
            echo
            echo "| Этап | Результат |"
            echo "|---|---|"
            echo "| Агент (Gemini) | $AGENT_OUTCOME |"
            echo "| Изменения есть | ${HAS_CHANGES:-неизвестно} |"
            echo "| Защищённые пути | $GUARD_OUTCOME |"
            echo "| ruff / mypy / pytest | $CHECKS_OUTCOME |"
            echo "| Push и PR | $PR_OUTCOME |"
            [ -n "$PR_URL" ] && echo && echo "PR: $PR_URL"
            echo
            echo "### Ответ агента"
            if [ -s "$RUNNER_TEMP/aider.out" ]; then
              tail -c 40000 "$RUNNER_TEMP/aider.out"
            else
              echo "_Вывода агента нет, смотрите лог._"
            fi
          } > "$report"
          gh issue comment "$ISSUE_NUM" --body-file "$report"
